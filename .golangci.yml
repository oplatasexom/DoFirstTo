# Настройки golangci-lint v2
version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - errorlint
    - gocritic
    - misspell
    - nolintlint
    - revive
    - unconvert
  settings:
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: error-return
        - name: error-naming
        - name: var-naming
  exclusions:
    rules:
      # В тестах сравнение с ожидаемым важнее обработки каждой ошибки
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
