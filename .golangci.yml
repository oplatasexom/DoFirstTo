# Настройки golangci-lint v2
version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - errorlint
    - gocritic
    - misspell
    - nolintlint
    - revive
    - unconvert
  settings:
    errcheck:
      # У вызовов Win32 «ошибка» — это GetLastError, а не признак сбоя:
      # успех проверяется по возвращаемому значению.
      exclude-functions:
        - (*golang.org/x/sys/windows.LazyProc).Call
        - golang.org/x/sys/windows.CloseHandle
        - golang.org/x/sys/windows.LocalFree
        - (golang.org/x/sys/windows/registry.Key).Close
    nolintlint:
      require-specific: true
    revive:
      rules:
        - name: error-return
        - name: error-naming
        - name: var-naming
  exclusions:
    # Close в defer и печать в консоль: их ошибки здесь не обрабатываются.
    presets:
      - std-error-handling
    rules:
      # В тестах сравнение с ожидаемым важнее обработки каждой ошибки
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
